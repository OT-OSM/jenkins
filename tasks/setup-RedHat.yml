---
- name: setup-RedHat | Ensure dependencies are installed
  ansible.builtin.package:
    name:
      - curl
      - python3-libselinux
      - initscripts
    state: present

- name: setup-RedHat | Ensure Jenkins repo is installed
  ansible.builtin.get_url:
    url: "{{ jenkins_repo_url }}"
    dest: /etc/yum.repos.d/jenkins.repo
    mode: 0644
  when: jenkins_repo_url | length > 0

- name: setup-RedHat | Add Jenkins repo GPG key
  ansible.builtin.rpm_key:
    state: present
    key: "{{ jenkins_repo_key_url }}"

- name: setup-RedHat | Download specific Jenkins version
  ansible.builtin.get_url:
    url: "{{ jenkins_pkg_url }}/jenkins-{{ jenkins_version }}-1.1.noarch.rpm"
    dest: "/tmp/jenkins-{{ jenkins_version }}-1.1.noarch.rpm"
    mode: 0644
  when: jenkins_version is defined

- name: setup-RedHat | Check if we downloaded a specific version of Jenkins
  ansible.builtin.stat:
    path: "/tmp/jenkins-{{ jenkins_version }}-1.1.noarch.rpm"
  register: specific_version
  when: jenkins_version is defined

- name: setup-RedHat | Install our specific version of Jenkins
  ansible.builtin.package:
    name: "/tmp/jenkins-{{ jenkins_version }}-1.1.noarch.rpm"
    state: present
  when: jenkins_version is defined and specific_version.stat.exists
  notify: Configure default users

- name: setup-RedHat | Ensure Jenkins is installed.
  ansible.builtin.package:
    name: jenkins
    state: "{{ jenkins_package_state }}"
  notify: Configure default users
