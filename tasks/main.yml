---
# Variable setup.

- name: Include file for remote system configuration
  ansible.builtin.include_tasks: pre_flight_check.yml

- name: Include OS-Specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Define jenkins_repo_url
  ansible.builtin.set_fact:
    jenkins_repo_url: "{{ jenkins_repo_url }}"
  when: jenkins_repo_url is not defined

- name: Define jenkins_repo_key_url
  ansible.builtin.set_fact:
    jenkins_repo_key_url: "{{ jenkins_repo_key_url }}"
  when: jenkins_repo_key_url is not defined

- name: Define jenkins_pkg_url
  ansible.builtin.set_fact:
    jenkins_pkg_url: "{{ jenkins_pkg_url }}"
  when: jenkins_pkg_url is not defined

- name: Including tasks for RedHat Family
  ansible.builtin.include_tasks: setup-RedHat.yml
  when: ansible_os_family == 'RedHat'

- name: Including tasks for Debian Family
  ansible.builtin.include_tasks: setup-Debian.yml
  when: ansible_os_family == 'Debian'

- name: Configure Jenkins init settings
  ansible.builtin.include_tasks: settings.yml

# Make sure Jenkins starts, then configure Jenkins.
- name: Ensure Jenkins is started and runs on startup.
  ansible.builtin.service:
    name: jenkins
    state: started
    enabled: true

- name: Wait for Jenkins to start up before proceeding.
  ansible.builtin.uri:
    url: "{{ jenkins_url }}/cli/"
    method: GET
    return_content: true
    timeout: 5
    body_format: raw
    follow_redirects: "none"
    status_code: 200,403
  register: result
  until: (result.status == 403 or result.status == 200) and (result.content.find("Please wait while") == -1)
  retries: "{{ jenkins_connection_retries }}"
  delay: "{{ jenkins_connection_delay }}"
  changed_when: false
  check_mode: false

- name: Get the jenkins-cli jarfile from the Jenkins server.
  ansible.builtin.get_url:
    url: "{{ jenkins_url }}/jnlpJars/jenkins-cli.jar"
    dest: "{{ jenkins_jar_location }}"
    mode: 0644
    force: no
  retries: 5
  delay: 10
  check_mode: false

- name: Remove Jenkins security init scripts after first startup.
  ansible.builtin.file:
    path: "{{ jenkins_home }}/init.groovy.d/basic-security.groovy"
    state: absent

- name: Update Jenkins and install configured plugins
  ansible.builtin.include_tasks: plugins.yml
  tags:
   - jenkins_plugin

- name: Including file for managing configuration as code
  ansible.builtin.include_tasks: casc_task.yml
  when: jenkins_enable_configuration_as_code
  tags:
   - jenkins_JCasC
