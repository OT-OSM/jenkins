---
#  ── Debian / sysvinit-style init file ──────────────────────────────
- name: Modify variables in init file
  lineinfile:
    dest: "{{ jenkins_init_file }}"
    insertafter: '^{{ item.option }}='
    regexp: '^{{ item.option }}=\"\${{ item.option }} '
    line: '{{ item.option }}="${{ item.option }} {{ item.value }}"'
    state: present
  with_items:
    - "{{ jenkins_init_changes }}"
  register: jenkins_init_prefix
  notify:
    - Restart jenkins
  when: ansible_os_family == 'Debian'

#  ── RedHat / systemd override (Amazon Linux 2023, RHEL 9+) ─────────
- name: Create systemd override directory for Jenkins
  file:
    path: /etc/systemd/system/jenkins.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: ansible_os_family == 'RedHat'

- name: Deploy Jenkins systemd override
  copy:
    dest: /etc/systemd/system/jenkins.service.d/override.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Service]
      Environment="JENKINS_PORT={{ jenkins_http_port }}"
      Environment="JAVA_OPTS={{ jenkins_java_options }}"
      Environment="JENKINS_HOME={{ jenkins_home }}"
      Environment="JENKINS_PREFIX={{ jenkins_url_prefix }}"
  register: jenkins_systemd_override
  notify:
    - Restart jenkins
  when: ansible_os_family == 'RedHat'

- name: Reload systemd after override change
  systemd:
    daemon_reload: yes
  when: ansible_os_family == 'RedHat' and jenkins_systemd_override.changed

#  ── Common settings (both families) ────────────────────────────────
- name: Set the Jenkins home directory
  lineinfile:
    dest: "{{ jenkins_init_file }}"
    regexp: '^JENKINS_HOME=.*'
    line: 'JENKINS_HOME={{ jenkins_home }}'
  register: jenkins_home_config
  when: ansible_os_family == 'Debian'

- name: Set HTTP port in Jenkins config.
  lineinfile:
    backrefs: true
    dest: "{{ jenkins_init_file }}"
    regexp: '^{{ jenkins_http_port_param }}='
    line: '{{ jenkins_http_port_param }}={{ jenkins_http_port }}'
  register: jenkins_http_config
  when: ansible_os_family == 'Debian'

- name: Ensure jenkins_home {{ jenkins_home }} exists
  file:
    path: "{{ jenkins_home }}"
    state: directory
    owner: jenkins
    group: jenkins
    mode: u+rwx
    follow: true

- name: Create custom init scripts directory.
  file:
    path: "{{ jenkins_home }}/init.groovy.d"
    state: directory
    owner: "{{ jenkins_process_user }}"
    group: "{{ jenkins_process_group }}"
    mode: 0775

- name: Trigger handlers immediately in case Jenkins was installed
  meta: flush_handlers
