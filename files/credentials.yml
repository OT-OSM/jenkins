---
# https://github.com/jenkinsci/configuration-as-code-plugin/tree/master/demos/credentials#example
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "USER_PASS_CREDENTIAL_ID"
              username: "----REPLACE_WITH_USERNAME----"
              password: "----REPLACE_WITH_PASSWORD----"
              description: "Username/Password Credentials for some-user"
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "SSH_CREDENTIAL_ID"
              username: "----REPLACE_WITH_USERNAME----"
              privateKeySource:
                directEntry:
                  privateKey: "----REPLACE_WITH_PRIVATE_SSH_KEY_CONTENT----"
              description: "SSH passphrase with private key file. Private key provided"
          - string:
              id: "TOKEN_CREDENTIAL_ID"
              scope: GLOBAL
              secret: "----REPLACE_WITH_TOKEN_CONTENT----"
              description: "Secret Text"
