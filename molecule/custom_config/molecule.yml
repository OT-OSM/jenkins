---
role_name_check: 1

dependency:
  name: galaxy
  options:
    ignore-errors: true

driver:
  name: docker

platforms:
  - name: instance
    image: "ubuntu:24.04"
    command: /sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: false

provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/../
  lint:
    name: ansible-lint
  inventory:
    group_vars:
      all:
        jenkins_http_port: 8081
        jenkins_jar_location: /var/lib/jenkins/jenkins-cli.jar
        jenkins_version: "2.401"
        jenkins_url_prefix: /jenkins
        
verifier:
  name: ansible
